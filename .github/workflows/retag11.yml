name: Retag11

# 一次性修复：提交信息带 [retag11] 标记的 main 推送触发。
# 探针结论：CI token 新建 tag 被拒（403），但 draft Release 创建 / 正文 PATCH / 删除均可用。
# 故此处只建 v1.1 draft（不带 target_commitish，不触发建 tag）；tag 由本地 SSH 推送重打包 commit 完成，
# 随后 tag-push 的 Release 工作流会把 draft 发布并传附件。顺带清掉 v1.2 正文里的诊断注释与调试附件。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retag11:
    if: ${{ contains(github.event.head_commit.message, '[retag11]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v1.1 draft and clean debug traces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          printf '%s\n' \
            '新增功能：' \
            '1. 跟进时间段：全天 / 谷时·半价 / 峰时 / 自定义跨午夜窗口，只约束自动跟进，手动不受限' \
            '2. 花费统计：核实会话 token 精确入账，按 DeepSeek 官方峰谷牌价计价；今日/近7天/累计、批次明细、卡片批次花费；新工具 douyin_follow_usage' \
            '3. 事件诊断计数（收到/归属/入账），面板花费区与 douyin_follow_usage 可查' \
            '4. 跟进结果显性化：无新线索时标明原因（均看过/搜索无结果）并附去重说明' \
            '修改了已知的bug：' \
            '1. 过验证卡死：关窗/取消立即结束并可重试；导航与重载改后台，不再被卡加载的落地页拖住' \
            '2. 花费统计与空闲检测收不到会话事件（作用域路由过滤），监听改 global 注册' \
            '3. 文案旧词「巡查」统一为「跟进 / 搜索」' > notes-v1.1.md
          ccode=$(curl -s --max-time 30 -o /tmp/create.json -w '%{http_code}' -X POST -H "$AUTH" "$API/releases" \
            -d "{\"tag_name\":\"0.2.2_v1.1\",\"name\":\"0.2.2_v1.1\",\"prerelease\":false,\"draft\":true,\"make_latest\":\"false\",\"body\":$(jq -Rs . < notes-v1.1.md)}")
          echo "create_draft=$ccode"
          jq -r '.id // .message' /tmp/create.json
          rels=$(curl -s --max-time 30 -H "$AUTH" "$API/releases?per_page=100")
          rid12=$(printf '%s' "$rels" | jq -r '.[] | select(.tag_name=="0.2.2_v1.2") | .id' | head -1)
          clean=$(printf '%s' "$rels" | jq -r '.[] | select(.tag_name=="0.2.2_v1.2") | .body | split("\n") | map(select(contains("retag8debug") | not)) | join("\n")')
          curl -s --max-time 30 -o /dev/null -w 'clean_body=%{http_code}\n' -X PATCH -H "$AUTH" "$API/releases/$rid12" -d "{\"body\":$(jq -cn --arg b "$clean" '$b')}"
          curl -s --max-time 30 -H "$AUTH" "$API/releases/$rid12/assets" | jq -r '.[] | select(.name=="debug-retag9.txt" or .name=="debug-retag10.txt") | .id' | while IFS= read -r aid; do
            curl -s --max-time 30 -o /dev/null -w "del_dbg_asset=$aid:%{http_code}\n" -X DELETE -H "$AUTH" "$API/releases/assets/$aid"
          done
          [ "$ccode" = "201" ]