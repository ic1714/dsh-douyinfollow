name: Retag4

# 一次性修复：提交信息带 [retag4] 标记的 main 推送触发。
# retag3 建 ref 用了短 sha 被 API 拒绝，Release 自动把 v1.1 tag 建到了 main HEAD；
# 这里把 v1.1 tag 强制指回其真实 commit（完整 sha）。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retag4:
    if: ${{ contains(github.event.head_commit.message, '[retag4]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Point v1.1 tag at its real commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          curl -sf -X PATCH -H "$AUTH" "$API/git/refs/tags/0.2.2_v1.1" \
            -d '{"sha":"9c21fa0ba61af0320f0a195a5f4f039bce13dd9c","force":true}'
          got=$(curl -sf -H "$AUTH" "$API/git/ref/tags/0.2.2_v1.1" | jq -r .object.sha)
          echo "v1.1 ref now: $got"
          [ "$got" = "9c21fa0ba61af0320f0a195a5f4f039bce13dd9c" ]