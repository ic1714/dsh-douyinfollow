name: Retag6

# 一次性修复：提交信息带 [retag6] 标记的 main 推送触发。
# v1.1 tag 被删后 Release 沦为 draft；发布 draft 并指定 target_commitish 为 v1.1 真实 commit，
# GitHub 会在该 commit 上重建 tag。响应写回仓库 debug-retag6.json 便于无凭据排查。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retag6:
    if: ${{ contains(github.event.head_commit.message, '[retag6]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v1.1 draft at its real commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          SHA="9c21fa0ba61af0320f0a195a5f4f039bce13dd9c"
          rid=$(curl -sf -H "$AUTH" "$API/releases/tags/0.2.2_v1.1" | jq -r .id)
          echo "rid=$rid"
          code=$(curl -s -o /tmp/pub.json -w '%{http_code}' -X PATCH -H "$AUTH" "$API/releases/$rid" \
            -d "{\"draft\":false,\"target_commitish\":\"$SHA\"}")
          echo "publish=$code"; cat /tmp/pub.json; echo
          got=$(curl -sf -H "$AUTH" "$API/git/ref/tags/0.2.2_v1.1" | jq -r .object.sha || true)
          echo "ref=$got"
          jq -cn --arg rid "$rid" --arg code "$code" --arg got "$got" --arg want "$SHA" \
            --slurpfile body /tmp/pub.json '{rid:$rid,publish_code:$code,ref:$got,want:$want,body:$body[0]}' > debug-retag6.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug-retag6.json
          git commit -m "debug: retag6 响应留档 [retag6done]" --quiet
          git push origin main
          [ "$got" = "$SHA" ]