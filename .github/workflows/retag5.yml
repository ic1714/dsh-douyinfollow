name: Retag5

# 一次性修复：提交信息带 [retag5] 标记的 main 推送触发。
# 把 v1.1 tag 指回真实 commit；PATCH 被拒时回退 DELETE+POST（完整 sha），并打印响应便于排查。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retag5:
    if: ${{ contains(github.event.head_commit.message, '[retag5]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Point v1.1 tag at its real commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          SHA="9c21fa0ba61af0320f0a195a5f4f039bce13dd9c"
          code=$(curl -s -o /tmp/patch.json -w '%{http_code}' -X PATCH -H "$AUTH" "$API/git/refs/tags/0.2.2_v1.1" -d "{\"sha\":\"$SHA\",\"force\":true}")
          echo "patch=$code"; cat /tmp/patch.json; echo
          if [ "$code" != "200" ]; then
            dcode=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE -H "$AUTH" "$API/git/refs/tags/0.2.2_v1.1")
            echo "delete=$dcode"; cat /tmp/del.json; echo
            pcode=$(curl -s -o /tmp/post.json -w '%{http_code}' -X POST -H "$AUTH" "$API/git/refs" -d "{\"ref\":\"refs/tags/0.2.2_v1.1\",\"sha\":\"$SHA\"}")
            echo "post=$pcode"; cat /tmp/post.json; echo
          fi
          got=$(curl -sf -H "$AUTH" "$API/git/ref/tags/0.2.2_v1.1" | jq -r .object.sha)
          echo "v1.1 ref now: $got"
          [ "$got" = "$SHA" ]