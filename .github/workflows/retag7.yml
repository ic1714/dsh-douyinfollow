name: Retag7

# 一次性修复：提交信息带 [retag7] 标记的 main 推送触发。
# 从带凭据的 Release 全列表里找 v1.1 draft，发布并指定 target_commitish 重建 tag；响应留档 debug-retag7.json。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retag7:
    if: ${{ contains(github.event.head_commit.message, '[retag7]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v1.1 draft at its real commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          SHA="9c21fa0ba61af0320f0a195a5f4f039bce13dd9c"
          rels=$(curl -s -H "$AUTH" "$API/releases?per_page=100")
          rid=$(printf '%s' "$rels" | jq -r '.[] | select(.tag_name=="0.2.2_v1.1") | .id' | head -1)
          draft=$(printf '%s' "$rels" | jq -r '.[] | select(.tag_name=="0.2.2_v1.1") | .draft' | head -1)
          echo "rid=$rid draft=$draft"
          pubcode=skip
          if [ -n "$rid" ]; then
            pubcode=$(curl -s -o /tmp/pub.json -w '%{http_code}' -X PATCH -H "$AUTH" "$API/releases/$rid" -d "{\"draft\":false,\"target_commitish\":\"$SHA\"}")
            echo "publish=$pubcode"; cat /tmp/pub.json; echo
          fi
          got=$(curl -s -H "$AUTH" "$API/git/ref/tags/0.2.2_v1.1" | jq -r '.object.sha // empty')
          echo "ref=$got"
          [ -f /tmp/pub.json ] || echo '{}' > /tmp/pub.json
          jq -cn --arg rid "$rid" --arg draft "$draft" --arg pubcode "$pubcode" --arg got "$got" --arg want "$SHA" \
            --slurpfile pub /tmp/pub.json \
            '{rid:$rid,draft:$draft,publish_code:$pubcode,pub_body:$pub[0],ref:$got,want:$want}' > debug-retag7.json
          cat debug-retag7.json
          # 留档走公开渠道：挂到 v1.2 Release 附件（90 秒后自删），不依赖 git push
          rid12=$(printf '%s' "$rels" | jq -r '.[] | select(.tag_name=="0.2.2_v1.2") | .id' | head -1)
          upcode=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data-binary @debug-retag7.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rid12/assets?name=debug-retag7.json")
          echo "upload=$upcode"
          sleep 90
          aid=$(curl -s -H "$AUTH" "$API/releases/$rid12/assets" | jq -r '.[] | select(.name=="debug-retag7.json") | .id' | head -1)
          if [ -n "$aid" ]; then curl -s -X DELETE -H "$AUTH" "$API/releases/assets/$aid"; echo "debug asset removed"; fi
          [ "$got" = "$SHA" ]